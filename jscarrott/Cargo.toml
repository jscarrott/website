[package]
name = "jscarrott"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
ratzilla = "0.3.1"
# ratatui-core (via ratzilla 0.3 → ratatui 0.30) needs a critical-section impl;
# wasm32-unknown-unknown has none by default, leaving `env` imports that break
# wasm instantiation. The `std` feature registers a std-backed implementation.
critical-section = { version = "1.2", features = ["std"] }
wasm-bindgen-futures = "0.4"
# ratzilla re-exports web-sys; enable the extra APIs used here (focusing the
# canvas, and awaiting the web font before the WebGL2 glyph atlas is built).
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "FontFaceSet", "console"] }
